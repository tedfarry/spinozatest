name: Deploy to OpenCPU Cloud

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      
      - name: Install R package dependencies
        run: |
          R -e 'install.packages("remotes")'
          R -e 'if (file.exists("DESCRIPTION")) remotes::install_deps(dependencies = TRUE)'
      
      - name: Check R package
        run: |
          R CMD build .
          R CMD check *.tar.gz --no-manual
        continue-on-error: true
      
      - name: Notify OpenCPU
        run: |
          echo "Package built successfully. OpenCPU should detect the update automatically."
