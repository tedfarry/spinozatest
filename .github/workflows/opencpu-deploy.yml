name: Deploy to OpenCPU Cloud

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
      
      - name: Install remotes package
        run: |
          install.packages('remotes')
        shell: Rscript {0}
      
      - name: Install package dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      
      - name: Install specific packages
        run: |
          install.packages(c('FinCal', 'flextable', 'rjson'))
        shell: Rscript {0}
      
      - name: Build package
        run: R CMD build .
      
      - name: Check package
        run: R CMD check *.tar.gz --no-manual --no-build-vignettes
        continue-on-error: true
      
      - name: Package deployed
        run: |
          echo "Package built successfully!"
          echo "Access at: https://tedfarry.ocpu.io/spinozatest/"
